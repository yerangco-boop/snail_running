# 고도 그래프 작업 브랜치 전용 검사: 분석 + 단위 테스트만 돌림.
# APK를 만들거나 릴리스를 올리지 않으므로 정식 앱·미리보기 앱에는 영향 없음.
# 이 브랜치를 ui-redesign에 합칠 때 이 파일은 지워도 됨.
name: Check (altitude-history)

on:
  push:
    branches: [altitude-history]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # 기존 코드에 이미 있던 경고(home_screen 미사용 필드 등)와 tool/·test/widget_test.dart의
      # 오래된 오류는 이번 작업과 무관하므로, lib/의 "오류"만 실패로 봄
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib
      - name: Test
        run: flutter test test/elevation_profile_test.dart
