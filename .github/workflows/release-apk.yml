name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          flutter build apk --release --dart-define=OPENWEATHER_API_KEY="$OPENWEATHER_API_KEY"

      - uses: actions/upload-artifact@v4
        with:
          name: snail-running-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # pubspec.yaml의 `version: 1.0.0+N`에서 versionCode(N)를 읽어 태그(vN)로 사용 —
      # 릴리스 태그와 실제 APK versionCode가 항상 일치하도록 보장
      - name: Read versionCode
        id: version
        run: |
          build=$(grep '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.build }}
          name: v${{ steps.version.outputs.build }}
          files: build/app/outputs/flutter-apk/app-release.apk
