# 미리보기 전용: Actions 결과물 + 'preview' 사전 릴리스(prerelease)로 올림.
# prerelease는 releases/latest에 잡히지 않아 정식 QR·업데이트 알림에 영향 없음.
# 고정 주소: https://github.com/yerangco-boop/snail_running/releases/download/preview/app-release.apk
name: Build Preview APK (ui-redesign)

on:
  push:
    branches: [ui-redesign]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 로컬(강의실 PC) 빌드와 같은 릴리스 키스토어로 서명해야 기존 설치 위에 업데이트로
      # 덮어설치 가능 — 서명 키가 다르면(예: CI 러너마다 새로 생기는 debug 키) 안드로이드가
      # 설치를 거부/충돌함. 키스토어 자체는 base64로 인코딩해 Secrets에 저장해두고 여기서
      # 디코드, key.properties는 android/app/build.gradle.kts가 읽는 파일이라 빌드 시점에만
      # 러너 임시 디렉터리에 생성(커밋되지 않음)
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-keystore.jks"

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/release-keystore.jks
          EOF

      - name: Build release APK
        env:
          # 정식 앱(com.example.snail_running)과 별개 앱으로 설치되게 패키지 ID에 접미사를 붙임
          APP_ID_SUFFIX: .preview
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          flutter build apk --release --dart-define=OPENWEATHER_API_KEY="$OPENWEATHER_API_KEY"

      - uses: actions/upload-artifact@v4
        with:
          name: snail-running-preview-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # QR로 설치할 수 있게 고정 주소(preview 태그)로도 게시. 매 빌드마다 덮어씀
      - name: Publish preview prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete preview --cleanup-tag --yes || true
          gh release create preview build/app/outputs/flutter-apk/app-release.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "미리보기 (ui-redesign ${GITHUB_SHA::7})" \
            --notes "UI 개편 미리보기 빌드. 정식 앱과 별개 앱(달팽이 미리보기)으로 설치됩니다."
