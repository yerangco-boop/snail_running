name: snail_running
description: "A custom slow jogging app for Hong Jeong-pyo"
publish_to: 'none'

version: 1.0.6+25

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  sqflite: ^2.3.0
  path: ^1.8.3
  flutter_tts: ^3.8.3
  audioplayers: ^5.2.1
  geolocator: ^10.1.0
  # AndroidSettings/ForegroundNotificationConfig(포그라운드 서비스 알림)를 쓰려면
  # 안드로이드 구현 패키지를 직접 import해야 해서 명시적 의존성으로 승격.
  # 웹 빌드에서는 location_settings_web.dart로 조건부 분기되어 참조되지 않음
  geolocator_android: ^4.5.0
  wakelock_plus: ^1.1.4
  # 알림 권한(Android 13+)과 배터리 최적화 예외 요청용 — 화면이 꺼진 뒤에도 위치
  # 콜백이 유지되려면 "항상 허용" 위치 권한만으로는 부족함 (v25에서 추가)
  permission_handler: ^11.3.1
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  sensors_plus: ^4.0.2
  url_launcher: ^6.1.14
  http: ^1.1.0
  geocoding: ^3.0.0
  package_info_plus: ^8.0.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  share_plus: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/icon/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FF5A8A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
